name: moura-connect-base

services:
  mongo:
    image: mongo:7
    container_name: mc-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mc-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mc-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mc-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic telemetria.leituras --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic alertas.eventos --partitions 3 --replication-factor 1
      echo '[kafka-init] topicos prontos:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  simulador:
    build: ./simulador
    container_name: mc-simulador
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      INTERVALO_MS: "5000"
      SEMENTE: "42"
    restart: unless-stopped

  # ─── Serviços da aplicação ───────────────────────────────────────

  ingestao:
    build:
      context: .
      dockerfile: services/ingestao/Dockerfile
    container_name: mc-ingestao
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      KAFKA_BROKER: kafka:29092
      MQTT_CLIENT_ID: ingestao-01
      BUFFER_MAX_SIZE: "5000"
      HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  processamento:
    build:
      context: .
      dockerfile: services/processamento/Dockerfile
    container_name: mc-processamento
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
      MONGO_URL: mongodb://mongo:27017/moura
      REDIS_URL: redis://redis:6379
      OFFLINE_THRESHOLD_MS: "600000"
      DESCARGA_THRESHOLD_MS: "900000"
      TENSAO_THRESHOLD_V: "48"
      TEMPERATURA_THRESHOLD_C: "45"
      TENSAO_COUNT_THRESHOLD: "3"
      OFFLINE_CHECK_INTERVAL_MS: "60000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: mc-api
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "3000"
      KAFKA_BROKER: kafka:29092
      MONGO_URL: mongodb://mongo:27017/moura
      REDIS_URL: redis://redis:6379
      JWT_SECRET: moura-jwt-secret-2026
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    container_name: mc-web
    ports:
      - "3001:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000/ws
    restart: unless-stopped

volumes:
  mongo-data:
